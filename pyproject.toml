[project]
name = "qx-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "madhuka2002", email = "madhukaaththanayaka@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.6",
    "inngest>=0.5.20",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.50.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
qx-rag = "qx_rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
